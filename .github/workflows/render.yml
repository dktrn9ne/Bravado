name: Render Bravado film
on:
  workflow_dispatch:
    inputs:
      brief:
        description: Project brief JSON path
        required: true
        default: projects/cadence.json
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - render.py
      - brief.py
      - verify_export.py
      - tests/**
      - skill/assets/starter/**
      - setup_fonts.py
      - projects/**
      - fonts/**
      - requirements.txt
      - .github/workflows/render.yml
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python setup_fonts.py
      - name: Render and verify
        env:
          BRIEF: ${{ inputs.brief || 'projects/cadence.json' }}
        run: |
          python render.py --brief "$BRIEF" --out output
          python verify_export.py output/*-bravado.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: bravado-film
          path: |
            output/*-bravado.mp4
            output/sound-design.wav
            output/review/**
