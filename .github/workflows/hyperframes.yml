name: Check HyperFrames backend
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - hyperframes/**
      - skill/assets/starter/hyperframes/**
      - .github/workflows/hyperframes.yml
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: hyperframes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: hyperframes/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run lint
